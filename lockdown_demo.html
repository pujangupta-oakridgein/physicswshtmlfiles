const SVGNS='http://www.w3.org/2000/svg';
function tab(headers,rows,caption=''){return `<table class="scienceTable"><caption>${esc(caption)}</caption><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function plotSVG(points,opts={}){const w=520,h=270,left=62,top=22,right=19,bottom=52,xmax=opts.xmax||Math.max(...points.map(p=>p[0])),ymax=opts.ymax||Math.max(...points.map(p=>p[1]));const X=x=>left+x/xmax*(w-left-right),Y=y=>h-bottom-y/ymax*(h-top-bottom);let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" class="scientificChart" role="img" aria-label="${esc(opts.title||'Graph plotted using supplied values')}">`;for(let i=0;i<=5;i++){let yy=ymax*i/5;let y=Y(yy);s+=`<path d="M${left} ${y}H${w-right}" stroke="#e1ebf2"/><text x="${left-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#3a5270">${Number(yy.toFixed(2))}</text>`}for(let i=0;i<=5;i++){let xx=xmax*i/5;let x=X(xx);s+=`<path d="M${x} ${top}V${h-bottom}" stroke="#eff3f7"/><text x="${x}" y="${h-bottom+16}" text-anchor="middle" font-size="11" fill="#3a5270">${Number(xx.toFixed(2))}</text>`}s+=`<path d="M${left} ${top}V${h-bottom}H${w-right}" fill="none" stroke="#25496c" stroke-width="1.7"/><polyline points="${points.map(p=>`${X(p[0])},${Y(p[1])}`).join(' ')}" fill="none" stroke="#0873d7" stroke-width="3"/>`;for(const p of points)s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" fill="#0873d7" stroke="white" stroke-width="1.5"/>`;s+=`<text x="${(w+left-right)/2}" y="${h-7}" text-anchor="middle" font-size="12" fill="#244566">${esc(opts.xlab||'x')}</text><text transform="translate(15 ${(h-bottom+top)/2}) rotate(-90)" text-anchor="middle" font-size="12" fill="#244566">${esc(opts.ylab||'y')}</text></svg>`;return s}
function blankGraph(xlab,ylab){let p='<svg viewBox="0 0 600 330" role="img" aria-label="Blank graphing grid">';for(let i=0;i<=10;i++){let x=66+i*49,y=280-i*24;p+=`<line x1="${x}" y1="40" x2="${x}" y2="280" stroke="#dae7f1"/><line x1="66" y1="${y}" x2="556" y2="${y}" stroke="#dae7f1"/>`;}p+='<path d="M66 40V280H556" stroke="#294f72" stroke-width="2" fill="none"/>';p+=`<text x="310" y="322" text-anchor="middle" fill="#294f72" font-size="14">${esc(xlab)}</text><text x="18" y="160" text-anchor="middle" transform="rotate(-90 18 160)" fill="#294f72" font-size="14">${esc(ylab)}</text></svg>`;return p;}
function specificData(q){let out='';if(q.headers&&q.rows)out+=tab(q.headers,q.rows,q.caption||'Experimental information');if(q.extra)out+=`<div class="databox">${esc(q.extra)}</div>`;if(q.plot)out+=`<p class="small"><b>Graphing task:</b> Open the full-size graph plotter, plot the points from the supplied data, and save your graph.</p><button class="primary graphOpen" onclick="openGraph('${q.id}')" ${state.mode==='exam'?'':'disabled'}>↗ Open full-screen graph plotter</button><div class="graphPreview">${graphSvg(q.id,false)}</div><p class="chartNote">${(state.graphs?.[q.id]?.points||[]).length} points saved for this question. The graph is stored with your answers.</p>`;return out||`<div class="databox">${esc(q.scenario)}</div>`}

function completeCount(){return BANK.filter(q=>q.parts.every((_,j)=>String(state.answers[q.id+'_'+j]||'').trim())).length}
function answeredCount(){return BANK.reduce((a,q)=>a+q.parts.filter((_,j)=>String(state.answers[q.id+'_'+j]||'').trim()).length,0)}
function marksFor(q,j){return q.rubrics[j].reduce((m,_,k)=>m+(state.checks[q.id+'_'+j+'_'+k]?1:0),0)}
function score(){return BANK.reduce((a,q)=>a+q.parts.reduce((b,_,j)=>b+marksFor(q,j),0),0)}

function main(html){$('root').innerHTML=html;document.body.classList.toggle('attempt-protected',state.mode==='exam');let paper=document.querySelector('.paper');if(paper)paper.setAttribute('data-student-mark',state.name+' · '+state.className+' · Attempt');}
function info(){return `<p class="muted">Your responses are saved to this browser on this device. Do not clear browser data or use private/incognito mode. A browser cannot guarantee screenshot prevention or secure code concealment.</p>`}
function home(){closeClock();state.mode='home';save();main(`<div class="centerbox"><div class="chip">Oakridge International School · Gachibowli</div><h1>IB MYP Physics — Energy, Electricity and Magnetism Holiday Homework</h1><p class="muted">20 questions · 80 written responses · 200 task marks · Criteria A, B, C and D</p><div class="stats"><div class="stat"><strong>${completeCount()}/20</strong>Completed</div><div class="stat"><strong>${answeredCount()}/80</strong>Answered</div><div class="stat"><strong>${clock(elapsed())}</strong>Active elapsed time</div></div><label>Student name<br><input id="studentName" placeholder="Full name" value="${esc(state.name)}" style="width:100%;padding:11px;margin:7px 0 12px;border:1px solid #a9bed1;border-radius:8px"></label><label>Class / section<br><input id="className" placeholder="e.g., Grade 9 MYP 4" value="${esc(state.className)}" style="width:100%;padding:11px;margin:7px 0 12px;border:1px solid #a9bed1;border-radius:8px"></label><div class="notice"><b>Instructions</b><p>Answer in your own words. Show steps, units and justification. Attempt one question at a time. Fullscreen is requested during attempt. Tab changes, exits and some copy shortcuts are logged as alerts, but browser protections are not tamper-proof. Save & Exit returns to this progress page. The timer measures time in active attempt mode and pauses on Save & Exit.</p><p>After submission, original answers become read-only. Then complete a checkbox-based self-assessment. Your teacher will independently review your responses and marks. Significant unjustified discrepancies may lead to an academic-integrity review under school policy. PDF export becomes available after self-correction.</p></div>${info()}<div class="row"><button class="primary" onclick="begin()">${answeredCount()?'Resume assignment':'Start assignment'} →</button><button class="outline" onclick="backup()">Export backup</button><button class="outline" onclick="$('backupfile').click()">Import backup</button></div><input type="file" id="backupfile" accept="application/json" class="hidden" onchange="restoreBackup(this)"></div>`)}
function begin(){let n=$('studentName').value.trim(),c=$('className').value.trim();if(!n||!c){alert('Enter your name and class to start.');return}state.name=n;state.className=c;state.mode='exam';state.runningFrom=Date.now();save();fullscreen();render()}
function backup(){const blob=new Blob([JSON.stringify({...state,elapsed:elapsed(),runningFrom:0},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Oakridge_Physics_Backup_'+(state.name||'Student').replace(/[^a-z0-9]/gi,'_')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restoreBackup(input){const file=input.files?.[0];if(!file)return;file.text().then(t=>{try{const b=JSON.parse(t);if(b.version!==1||!b.answers||!b.checks)throw Error('Invalid backup');if(!confirm('Replace locally saved progress with the selected backup?'))return;state=Object.assign(fresh(),b,{mode:'home',runningFrom:0});save();home()}catch(e){alert('Cannot import backup: '+e.message)}})}
function setAnswer(id,j,el){if(state.mode!=='exam')return;state.answers[id+'_'+j]=el.value;save();let n=$('answered');if(n)n.textContent=answeredCount()+'/80 answered';let p=$('progressFill');if(p)p.style.width=completeCount()/20*100+'%'}
function next(i){state.index=Math.max(0,Math.min(19,i));save();render();window.scrollTo(0,0)}
function saveExit(){if(state.mode==='exam'){closeClock();state.mode='home';save();exitFullscreen();home()}}
function submit(){if(!confirm('Submit all 20 questions? Your original answers will be locked and the marking scheme will be revealed. You cannot return to attempt mode.'))return;closeClock();state.mode='mark';state.submittedAt=new Date().toISOString();save();exitFullscreen();render()}
function mark(k,on){if(state.mode!=='mark')return;state.checks[k]=on;save();render()}
function finishMark(){if(!confirm('Finish self-evaluation? This locks your checked marks and enables the PDF correction report.'))return;state.mode='done';save();render()}
function sidebar(){return `<aside class="side noprint"><div class="sideProfile"><span>Student</span><b>${esc(state.name)}</b><span>Class</span><b>${esc(state.className)}</b></div><strong>Overall Progress</strong><p class="small muted" id="answered">${answeredCount()}/80 responses · ${completeCount()}/20 completed</p><div class="progress"><span id="progressFill" style="width:${completeCount()/20*100}%"></span></div>${['A','B','C','D'].map(c=>`<div class="navgroup"><div class="section">● Criterion ${c} — ${c==='A'?'Knowing and Understanding':c==='B'?'Inquiring and Designing':c==='C'?'Processing and Evaluating':'Reflecting on Impacts'} (${BANK.filter(q=>q.id[0]===c&&q.parts.every((_,j)=>String(state.answers[q.id+'_'+j]||'').trim())).length}/5)</div>${BANK.map((q,i)=>q.id[0]===c?`<button class="qnav ${i===state.index?'active':''} ${q.parts.every((_,j)=>String(state.answers[q.id+'_'+j]||'').trim())?'done':''} ${state.review?.[q.id]?'flagged':''}" onclick="next(${i})"><span class="qid">${q.id}</span><span>${esc(q.title)}</span></button>`:'').join('')}</div>`).join('')}<button class="outline" onclick="${state.mode==='exam'?'saveExit()':'showProgress()'}">${state.mode==='exam'?'💾 Save and Exit':'Progress dashboard'}</button>${state.mode==='exam'?'<button class="danger" onclick="submit()">Submit Assignment</button>':''}</aside>`}

function header(){return `<header class="top noprint"><div class="brandgroup"><div class="brand">🌳 Oakridge<small>International School<br>Gachibowli</small></div><div class="headerdivider"></div><div><div class="examTitle">IB MYP Physics<br>Holiday Homework</div><small>Energy Sources · Electricity · Magnetism · 20 Questions · 200 Marks</small></div></div><div class="topRight"><div class="securetag">🔒 <b>${state.mode==='exam'?'Attempt Mode':'Review Mode'}</b><small>Browser deterrents</small></div><div class="securetag">⚠ Copy Deterrents<small>Browser-level only</small></div><div class="topTimer">⏱ Time Elapsed <span id="timer">${clock(elapsed())}</span></div></div></header>`}

function questionHtml(q){const i=state.index;return `<div class="paperbar">Criterion ${q.id[0]} ❯ ${esc(q.unit)} <span style="float:right">Question ${i+1} of 20</span></div><div class="row between"><h1>${q.id}. ${esc(q.title)}</h1><span class="pill">10 marks</span></div><div class="stimulusLead">${esc(q.scenario)}</div><div class="stimulusGrid"><div class="stimulusVisual"><img class="scenarioimg" src="${q.img}" alt="Contextual physics diagram for ${esc(q.title)}"></div><div class="stimulusData"><h4>Data and stimulus</h4>${specificData(q)}</div></div>${q.parts.map((part,j)=>`<div class="subpart"><div class="subhead"><span class="partbubble">${letters[j]}</span><div style="flex:1"><h3>${esc(part)}</h3><span class="chip">${q.marks[j]} marks</span></div></div>${state.mode==='exam'?`<textarea class="response" aria-label="Answer ${q.id}(${letters[j]})" oninput="setAnswer('${q.id}',${j},this)" placeholder="Type your answer and show working here...">${esc(state.answers[q.id+'_'+j]||'')}</textarea>`:`<p class="small muted">Original submitted response:</p><div class="answerquote">${esc(state.answers[q.id+'_'+j]||'(No response submitted)')}</div><h4>Detailed marking checklist</h4>${q.rubrics[j].map((rp,k)=>`<label class="checkline"><input type="checkbox" ${state.checks[q.id+'_'+j+'_'+k]?'checked':''} ${state.mode==='done'?'disabled':''} onchange="mark('${q.id+'_'+j+'_'+k}',this.checked)"><span>${esc(rp)} <b class="small">(1 mark)</b></span></label>`).join('')}<p class="grade">Self-assessed: ${marksFor(q,j)}/${q.marks[j]}</p>`}</div>`).join('')}`}


// Student graphing workspace: saved by question ID in the same local assignment state.
const GRAPH_W=900, GRAPH_H=545, GP={l:98,r:35,t:35,b:88};
let currentGraphId=null, draggedGraphPoint=-1;
function graphConfig(id){return BANK.find(q=>q.id===id)?.plot}
function graphDefault(id){let q=graphConfig(id),p=q?.points||[],mx=Math.max(1,...p.map(a=>Number(a[0]))),my=Math.max(1,...p.map(a=>Number(a[1])));const nice=(v)=>{let pow=Math.pow(10,Math.floor(Math.log10(v)));let n=v/pow;return (n<=1?1:n<=2?2:n<=5?5:10)*pow};return {points:[],xmax:nice(mx*1.12),ymax:nice(my*1.15),connect:false,bestfit:false};}
function getGraph(id){state.graphs=state.graphs||{};return state.graphs[id]||(state.graphs[id]=graphDefault(id));}
function graphSvg(id,large=false){const cfg=graphConfig(id);if(!cfg)return '';const g=getGraph(id),w=GRAPH_W,h=GRAPH_H,{l,r,t,b}=GP,xlen=w-l-r,ylen=h-t-b;
 const xx=x=>l+x/g.xmax*xlen,yy=y=>h-b-y/g.ymax*ylen;
 const fmt=n=>Number(Number(n).toPrecision(4)).toString();
 let out=`<svg class=\"${large?'plotterSvg':'savedPlotSvg'}\" viewBox=\"0 0 ${w} ${h}\" role=\"img\" aria-label=\"Student created graph: ${esc(cfg.x)} against ${esc(cfg.y)}\" xmlns=\"http://www.w3.org/2000/svg\">`;
 out+=`<rect width=\"${w}\" height=\"${h}\" fill=\"#fff\"/>`;
 for(let i=0;i<=10;i++){let x=l+i*xlen/10,y=t+i*ylen/10;out+=`<line x1=\"${x}\" y1=\"${t}\" x2=\"${x}\" y2=\"${h-b}\" stroke=\"#dfe8f2\"/><line x1=\"${l}\" y1=\"${y}\" x2=\"${w-r}\" y2=\"${y}\" stroke=\"#dfe8f2\"/>`;let xv=g.xmax*i/10,yv=g.ymax*(10-i)/10;out+=`<text x=\"${x}\" y=\"${h-b+23}\" font-size=\"15\" text-anchor=\"middle\" fill=\"#183c60\">${fmt(xv)}</text><text x=\"${l-11}\" y=\"${y+5}\" font-size=\"15\" text-anchor=\"end\" fill=\"#183c60\">${fmt(yv)}</text>`;}
 out+=`<path d=\"M${l} ${t}V${h-b}H${w-r}\" fill=\"none\" stroke=\"#163f66\" stroke-width=\"3\"/><text x=\"${(l+w-r)/2}\" y=\"${h-18}\" font-size=\"19\" font-weight=\"600\" text-anchor=\"middle\" fill=\"#183c60\">${esc(cfg.x)}</text><text transform=\"translate(25 ${(t+h-b)/2}) rotate(-90)\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"600\" fill=\"#183c60\">${esc(cfg.y)}</text>`;
 const pts=g.points.filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1])&&p[0]>=0&&p[1]>=0&&p[0]<=g.xmax&&p[1]<=g.ymax);
 if(g.connect&&pts.length>1)out+=`<polyline points=\"${pts.map(p=>xx(p[0])+','+yy(p[1])).join(' ')}\" stroke=\"#196cc6\" stroke-width=\"3\" fill=\"none\"/>`;
 if(g.bestfit&&pts.length>=2){let n=pts.length,sx=0,sy=0,sxx=0,sxy=0;for(const [x,y] of pts){sx+=x;sy+=y;sxx+=x*x;sxy+=x*y;}let den=n*sxx-sx*sx;if(Math.abs(den)>1e-12){let m=(n*sxy-sx*sy)/den,c=(sy-m*sx)/n;let xa=Math.max(0,m>=0?-c/m:0),xb=g.xmax;let seg=[[0,c],[g.xmax,m*g.xmax+c]];let clips=[];for(let [x,y] of seg){if(y>=0&&y<=g.ymax)clips.push([x,y]);}for(let y of [0,g.ymax]){let x=(y-c)/m;if(Number.isFinite(x)&&x>=0&&x<=g.xmax)clips.push([x,y]);}clips.sort((a,b)=>a[0]-b[0]);if(clips.length>=2)out+=`<path d=\"M${xx(clips[0][0])} ${yy(clips[0][1])}L${xx(clips.at(-1)[0])} ${yy(clips.at(-1)[1])}\" stroke=\"#dd6927\" stroke-width=\"3\" stroke-dasharray=\"10 6\" fill=\"none\"/>`;}}
 g.points.forEach((p,i)=>{if(p[0]<0||p[1]<0||p[0]>g.xmax||p[1]>g.ymax)return;out+=`<circle cx=\"${xx(p[0])}\" cy=\"${yy(p[1])}\" r=\"${large?8:7}\" fill=\"#1168cd\" stroke=\"white\" stroke-width=\"2\" ${large?`data-plot-point=\"${i}\"`:''}/>`;});
 if(large)out+=`<rect x=\"${l}\" y=\"${t}\" width=\"${xlen}\" height=\"${ylen}\" fill=\"transparent\" data-plot-area=\"true\" style=\"cursor:crosshair\"/>`;
 // Pointer event targets added last for large dragging and accurate hitboxes.
 if(large)g.points.forEach((p,i)=>{if(p[0]<0||p[1]<0||p[0]>g.xmax||p[1]>g.ymax)return;out+=`<circle cx=\"${xx(p[0])}\" cy=\"${yy(p[1])}\" r=\"14\" fill=\"transparent\" stroke=\"none\" data-plot-handle=\"${i}\" style=\"cursor:grab\"/>`;});
 return out+'</svg>';
}
function openGraph(id){if(state.mode!=='exam'||!graphConfig(id))return;currentGraphId=id;getGraph(id);renderGraphModal();}
function closeGraph(){const m=document.getElementById('graphModal');if(m)m.remove();currentGraphId=null;draggedGraphPoint=-1;save();}
function renderGraphModal(){let id=currentGraphId,cfg=graphConfig(id),g=getGraph(id);let old=document.getElementById('graphModal');if(old)old.remove();let m=document.createElement('div');m.id='graphModal';m.className='graphModal';m.innerHTML=`<section class=\"plotterDialog\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Graph plotter for ${id}\"><div class=\"plotterHeader\"><div><b>📈 Graph Plotter — ${id}</b><div class=\"small\">Click to add points, or enter exact x/y coordinates. Drag points to adjust. Changes auto-save.</div></div><button class=\"primary\" id=\"graphSaveClose\">💾 Save Graph & Return</button></div><div class=\"plotterBody\"><div class=\"plotterCanvas\" id=\"plotterCanvas\">${graphSvg(id,true)}</div><aside class=\"plotterControls\"><h3>Axes and scale</h3><label>X-axis maximum <input id=\"graphXmax\" type=\"number\" min=\"0.001\" step=\"any\" value=\"${g.xmax}\"></label><label>Y-axis maximum <input id=\"graphYmax\" type=\"number\" min=\"0.001\" step=\"any\" value=\"${g.ymax}\"></label><button class=\"outline\" id=\"applyScale\">Apply scale</button><h3>Plot an exact point</h3><div class=\"coordinateFields\"><label>x <input id=\"graphX\" type=\"number\" step=\"any\" placeholder=\"x value\"></label><label>y <input id=\"graphY\" type=\"number\" step=\"any\" placeholder=\"y value\"></label></div><button class=\"primary\" id=\"addPoint\">+ Add point</button><h3>Plot settings</h3><label class=\"plotterCheck\"><input type=\"checkbox\" id=\"connectPoints\" ${g.connect?'checked':''}> Connect points in plotted order</label><label class=\"plotterCheck\"><input type=\"checkbox\" id=\"bestFit\" ${g.bestfit?'checked':''}> Show linear best-fit line</label><button class=\"outline\" id=\"undoPoint\">↶ Undo last point</button><button class=\"danger\" id=\"clearPoints\">Clear all points</button><p class=\"chartNote\" id=\"pointCount\">${g.points.length} points saved</p><div class=\"plotPointList\" id=\"plotPointList\"></div></aside></div></section>`;document.body.appendChild(m);
 const bind=(x,fn)=>document.getElementById(x).addEventListener('click',fn);
 bind('graphSaveClose',()=>{closeGraph();render();});bind('applyScale',()=>{let x=Number(document.getElementById('graphXmax').value),y=Number(document.getElementById('graphYmax').value);if(!(x>0&&y>0))return alert('Axis maxima must be positive numbers.');g.xmax=x;g.ymax=y;refreshGraph();});bind('addPoint',()=>{let x=Number(document.getElementById('graphX').value),y=Number(document.getElementById('graphY').value);if(!Number.isFinite(x)||!Number.isFinite(y)||document.getElementById('graphX').value===''||document.getElementById('graphY').value==='')return alert('Enter valid x and y values.');addGraphPoint(x,y);});
 bind('undoPoint',()=>{g.points.pop();refreshGraph();});bind('clearPoints',()=>{if(confirm('Clear every plotted point in this graph?')){g.points=[];refreshGraph();}});
 document.getElementById('connectPoints').addEventListener('change',e=>{g.connect=e.target.checked;refreshGraph();});document.getElementById('bestFit').addEventListener('change',e=>{g.bestfit=e.target.checked;refreshGraph();});
 const area=document.getElementById('plotterCanvas');area.addEventListener('pointerdown',e=>{let h=e.target.closest('[data-plot-handle]');if(h){draggedGraphPoint=Number(h.getAttribute('data-plot-handle'));e.preventDefault();return;}if(e.target.closest('[data-plot-area]')){let p=eventGraphCoordinates(e);if(p)addGraphPoint(...p);}});
 area.addEventListener('pointermove',e=>{if(draggedGraphPoint<0)return;let p=eventGraphCoordinates(e);if(p){g.points[draggedGraphPoint]=p;refreshGraph();}});window.addEventListener('pointerup',()=>draggedGraphPoint=-1,{once:true});
 // Window-level pointerup ensures dragging reliably ends even if pointer is released outside plot.
 area.addEventListener('pointerup',()=>{draggedGraphPoint=-1;});
 refreshGraph();
}
function eventGraphCoordinates(e){let svg=document.querySelector('#plotterCanvas svg');if(!svg)return null;let r=svg.getBoundingClientRect(),g=getGraph(currentGraphId);let px=(e.clientX-r.left)*GRAPH_W/r.width,py=(e.clientY-r.top)*GRAPH_H/r.height;let x=(px-GP.l)/(GRAPH_W-GP.l-GP.r)*g.xmax,y=(GRAPH_H-GP.b-py)/(GRAPH_H-GP.t-GP.b)*g.ymax;x=Math.max(0,Math.min(g.xmax,x));y=Math.max(0,Math.min(g.ymax,y));let precision=v=>Number(v.toPrecision(4));return [precision(x),precision(y)];}
function addGraphPoint(x,y){let g=getGraph(currentGraphId);if(x<0||y<0||x>g.xmax||y>g.ymax)return alert('Point lies outside the graph. Increase the axis maximum first.');g.points.push([x,y]);refreshGraph();}
function deleteGraphPoint(i){getGraph(currentGraphId).points.splice(i,1);refreshGraph();}
function refreshGraph(){if(!currentGraphId)return;let g=getGraph(currentGraphId);save();let canvas=document.getElementById('plotterCanvas');if(canvas)canvas.innerHTML=graphSvg(currentGraphId,true);let c=document.getElementById('pointCount');if(c)c.textContent=g.points.length+' points saved';let lst=document.getElementById('plotPointList');if(lst)lst.innerHTML=g.points.map((p,i)=>`<div class=\"savedPoint\">${i+1}. (${p[0]}, ${p[1]}) <button class=\"outline\" onclick=\"deleteGraphPoint(${i})\" aria-label=\"Remove point ${i+1}\">×</button></div>`).join('')||'<span class=\"muted\">No points plotted yet.</span>';}

function rightpanel(){return `<aside class="panel noprint"><div class="rightTimer"><div class="small">⏱ Time Elapsed</div><strong id="sideTimer">${clock(elapsed())}</strong><div class="small muted">Active attempt time</div></div><div class="toolpanel"><h4>Question Tools</h4><div class="inside"><button class="outline" onclick="flagQuestion()">⚑ ${state.review?.[BANK[state.index].id]?'Unflag for review':'Flag question'}</button><button class="outline" onclick="expandAnswer()">⤢ Expand response</button><button class="outline" onclick="window.print()" ${state.mode==='exam'?'disabled':''}>Print report</button></div></div><div class="toolpanel warn"><h4>Important</h4><div class="inside">Answers save on this device. You may save and resume. The browser cannot stop all screenshots or source-code access. Teacher correction follows self-assessment.</div></div>${state.mode==='exam'?'<button class="outline" style="width:100%;margin-bottom:8px" onclick="saveExit()">Save and Exit</button>':''}</aside>`}
function render(){if(state.mode==='home'){home();return}if(state.mode==='done'){done();return}let q=BANK[state.index];main(`${header()}<main class="shell">${sidebar()}<article class="paper">${state.mode==='mark'?`<div class="notice"><b>Self-correction is provisional.</b> Tick a mark only where the original response provides the required evidence. The teacher will independently correct your paper. Significant unjustified variations may prompt academic-integrity review.</div><div class="row between"><strong>Provisional total: ${score()}/200</strong><button class="outline" onclick="finishMark()">Finish self-evaluation</button></div>`:''}${questionHtml(q)}<div class="actions"><button class="secondary" onclick="next(${state.index-1})" ${state.index===0?'disabled':''}>← Previous</button>${state.mode==='exam'?'<button class="outline" onclick="saveExit()">💾 Save & Exit</button>':''}<button class="primary" onclick="next(${state.index+1})" ${state.index===19?'disabled':''}>Next Question →</button></div></article>${rightpanel()}</main><div class="footer noprint">This local HTML cannot guarantee screenshot prevention, secure code concealment or tamper-proof assessment records.</div><div class="watermark">${esc(state.name)} · ${esc(state.className)} · ${new Date().toLocaleDateString()}</div>`);checkFullscreen()}

function showProgress(){closeClock();save();main(`${header()}<div class="centerbox"><h1>Self-evaluation progress</h1><div class="stats"><div class="stat"><strong>${answeredCount()}/80</strong>Submitted answers</div><div class="stat"><strong>${Object.values(state.checks).filter(Boolean).length}/200</strong>Checked points</div><div class="stat"><strong>${score()}</strong>Provisional marks</div></div><p class="muted">Continue reviewing each subpart and tick only justified mark points.</p><button class="primary" onclick="render()">Return to correction</button><button class="outline" onclick="finishMark()">Finish evaluation</button></div>`)}
function done(){main(`${header()}<div class="centerbox noprint"><h1>Self-evaluation complete</h1><p>Your responses and self-assigned points are now frozen. Teacher correction remains authoritative.</p><div class="stats"><div class="stat"><strong>${score()}/200</strong>Self score</div><div class="stat"><strong>${answeredCount()}/80</strong>Answered</div><div class="stat"><strong>${clock(state.elapsed)}</strong>Active time</div></div><div class="notice">Teacher correction will be done after self-correction. Significant unjustified variation between self-assessment and teacher assessment may lead to an academic-integrity review under school policy.</div><button class="primary" onclick="printReport()">Save full corrected paper as PDF</button><button class="outline" onclick="backup()">Export backup</button></div><section id="printReport" class="paper" style="max-width:960px;margin:16px auto"><h1>Oakridge International School — Physics Homework</h1><p><b>Student:</b> ${esc(state.name)} &nbsp; <b>Class:</b> ${esc(state.className)}</p><p><b>Self-assessed marks:</b> ${score()}/200 · <b>Active time:</b> ${clock(state.elapsed)} · <b>Submitted:</b> ${esc(state.submittedAt||'')}</p><p><b>Teacher review:</b> Pending · self-scoring is provisional.</p>${BANK.map(q=>`<div class="report-card"><h2>${q.id}. ${esc(q.title)} <span class="small muted">(${q.parts.reduce((s,_,j)=>s+marksFor(q,j),0)}/10)</span></h2><p class="small"><b>Context:</b> ${esc(q.scenario)}</p>${q.headers&&q.rows?tab(q.headers,q.rows,q.caption||'Question data'):''}${q.plot?`<div class="report-graph"><h3>Student-plotted graph</h3>${graphSvg(q.id,false)}</div>`:''}${q.parts.map((p,j)=>`<div class="subpart"><h3>(${letters[j]}) ${esc(p)} [${q.marks[j]}]</h3><p><b>Original answer:</b></p><div class="answerquote">${esc(state.answers[q.id+'_'+j]||'(blank)')}</div><p><b>Correction checklist (${marksFor(q,j)}/${q.marks[j]}):</b></p>${q.rubrics[j].map((r,k)=>`<div class="report-point">${state.checks[q.id+'_'+j+'_'+k]?'☑':'☐'} ${esc(r)}</div>`).join('')}</div>`).join('')}</div>`).join('')}<h2>Teacher verification</h2><p>Teacher-awarded marks: __________ / 200</p><p>Teacher comments: _____________________________________________________</p><p>Self-assessment is provisional and subject to independent teacher correction.</p></section>`)}
function flagQuestion(){state.review=state.review||{};const id=BANK[state.index].id;state.review[id]=!state.review[id];save();render()}
function expandAnswer(){const a=document.querySelector('.response');if(a){a.style.height=a.style.height==='240px'?'76px':'240px';a.focus()}}
function printReport(){window.print()}
function checkFullscreen(){let w=$('fullscreenWarning');if(w)w.remove();if(state.mode!=='exam'||document.fullscreenElement)return;let d=document.createElement('div');d.id='fullscreenWarning';d.className='fullwarn noprint';d.innerHTML=`<div><h2>Fullscreen attempt mode</h2><p>The assessment asks you to remain fullscreen while answering. Exiting fullscreen will be logged but cannot be prevented by ordinary HTML.</p><button class="primary" onclick="fullscreen()">Return to fullscreen</button><button class="secondary" onclick="saveExit()">Save & Exit</button></div>`;document.body.appendChild(d)}
setInterval(()=>{if(state.mode==='exam'){let t=$('timer');if(t)t.textContent=clock(elapsed());let rt=$('sideTimer');if(rt)rt.textContent=clock(elapsed());if(Math.floor(Date.now()/10000)!==window._saveTick){window._saveTick=Math.floor(Date.now()/10000);save()}}},1000);
document.addEventListener('fullscreenchange',()=>{if(state.mode==='exam'&&!document.fullscreenElement){state.violations++;save()}checkFullscreen()});
document.addEventListener('visibilitychange',()=>{if(state.mode==='exam'&&document.hidden){state.violations++;save()}});
// These are browser-level deterrents only; OS screenshots and developer tools cannot be disabled by a webpage.
let integrityTimeout;
function integrityWarning(message){if(state.mode!=='exam')return;let el=document.getElementById('integrityNotice');if(!el){el=document.createElement('div');el.id='integrityNotice';el.setAttribute('role','alert');document.body.appendChild(el)}el.textContent=message;clearTimeout(integrityTimeout);integrityTimeout=setTimeout(()=>el?.remove(),3500)}
function denyAttempt(e){if(state.mode!=='exam')return; e.preventDefault();e.stopImmediatePropagation();integrityWarning('Copying or exporting assessment content is disabled during attempt mode.');}
['copy','cut','paste','contextmenu','dragstart','drop'].forEach(type=>document.addEventListener(type,denyAttempt,true));
document.addEventListener('selectstart',e=>{if(state.mode==='exam'&&!e.target.closest('textarea,input'))e.preventDefault()},true);
document.addEventListener('keydown',e=>{
 if(state.mode!=='exam')return;
 const k=e.key.toLowerCase();const mod=e.ctrlKey||e.metaKey;
 if(k==='printscreen'){state.violations++;save();integrityWarning('Screenshot key detected. This browser cannot prevent operating-system screenshots.');return}
 const blocked=mod&&(['c','v','x','a','p','s','u'].includes(k)||e.shiftKey&&['i','j','c','k'].includes(k));
 if(blocked||k==='f12'){e.preventDefault();e.stopImmediatePropagation();if(k==='f12'||k==='u'||e.shiftKey){state.violations++;save()}integrityWarning('That shortcut is disabled during attempt mode.');}
},true);
window.addEventListener('blur',()=>{if(state.mode==='exam'){state.violations++;save()}},true);
window.addEventListener('beforeunload',()=>{if(state.mode==='exam'){closeClock();save()}});
if(state.mode==='exam') {state.runningFrom=Date.now();save();render()} else if(state.mode==='mark')render();else if(state.mode==='done')done();else home();
</script></body></html>
